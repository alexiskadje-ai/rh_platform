name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: rh_user
          POSTGRES_PASSWORD: rh_password
          POSTGRES_DB: rh_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rh_user -d rh_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://rh_user:rh_password@localhost:5432/rh_platform
      AUTH_SECRET: ci-auth-secret-for-build-only
      NEXTAUTH_SECRET: ci-auth-secret-for-build-only
      AUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
